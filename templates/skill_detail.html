{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Details | AI Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="{% static "css/skill_detail.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>
    
    <header class="futuristic-header">
        <div class="container">
            <a href="{% url "home" %}" class="back-button neon-hover">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
            <h1 class="neon-text" id="skill-title">Skill Details</h1>
        </div>
    </header>

    <main class="container">
        <section class="skill-details">
            <div class="skill-header">
                <div class="skill-icon glow" id="skill-icon">
                    <i class="fas fa-question" id="skill-icon-img"></i>
                </div>
                <div class="skill-meta">
                    <h2 id="skill-name">Skill Name</h2>
                    <div class="skill-tags" id="skill-tags"></div>
                </div>
            </div>

            <div class="skill-content">
                <div class="tools-used">
                    <h3 class="content-title"><i class="fas fa-tools"></i> Tools & Technologies</h3>
                    <ul class="tools-grid" id="tools-list"></ul>
                </div>

                <div class="projects">
                    <h3 class="content-title"><i class="fas fa-project-diagram"></i> Projects</h3>
                    <div class="projects-grid" id="projects-grid"></div>
                </div>

                <div class="description">
                    <h3 class="content-title"><i class="fas fa-file-alt"></i> Description</h3>
                    <p id="skill-description">Loading description...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    {% comment %} <script src="js/particles.js"></script> {% endcomment %}
    <!-- In your skill_detail.html template -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Get data from Django template variables
        const skillId = "{{ skill_id }}";
        const skillData = {{ skill|safe }};
    
        if (skillData) {
            // Populate skill data
            document.getElementById('skill-title').textContent = skillData.name;
            document.getElementById('skill-name').textContent = skillData.name;
            document.getElementById('skill-icon-img').className = `fas ${skillData.icon}`;
            document.getElementById('skill-description').textContent = skillData.description;
    
            // Populate tags
            const tagsContainer = document.getElementById('skill-tags');
            skillData.tags.forEach(tag => {
                tagsContainer.innerHTML += `<span class="tag neon-hover">${tag}</span>`;
            });
    
            // Populate tools
            const toolsList = document.getElementById('tools-list');
            skillData.tools.forEach(tool => {
                toolsList.innerHTML += `
                    <li class="tool-item glow">
                        <i class="fas fa-cog"></i>
                        ${tool}
                    </li>`;
            });
    
            // Populate projects
            const projectsGrid = document.getElementById('projects-grid');
            skillData.projects.forEach(project => {
                projectsGrid.innerHTML += `
                    <div class="project-card glow">
                        <h4>${project.name}</h4>
                        <p>${project.description}</p>
                    </div>`;
            });
        } else {
            // Handle invalid skill ID
            window.location.href = "{% url 'home' %}";
        }
    });
    </script>
</body>
</html>
